[package]
name = "soundstage-core"
version = "0.1.0"
description = "Soundstage core: script, direction, licence gate, mix, loudness, export"
edition = "2021"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hound = "3.5"
ureq = { version = "2", default-features = false, features = ["tls"] }
