[package]
name = "soundstage-core"
version = "0.2.0"
description = "Soundstage core: script, direction, licence gate, mix, loudness, export"
edition = "2021"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hound = "3.5"
ureq = { version = "2", default-features = false, features = ["tls", "native-certs"] }
symphonia = { version = "0.5", default-features = false, features = ["mp3", "flac", "ogg", "vorbis", "aac", "isomp4", "wav", "pcm"] }
zip = { version = "9.1.0", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }
