name: checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # The installer bundles FFmpeg and Whisper, which are large and only needed to build a release. The build wants the
      # files to exist, so empty stand-ins are enough here. (Tests that need the real programs skip themselves.)
      - name: Stand-ins for the bundled programs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force app/src-tauri/resources/whisper | Out-Null
          foreach ($f in "ffmpeg.exe", "FFMPEG-LICENSE.txt", "FFMPEG-NOTICE.txt") {
            if (-not (Test-Path "app/src-tauri/resources/$f")) { Set-Content "app/src-tauri/resources/$f" "stand-in" }
          }
          Set-Content app/src-tauri/resources/whisper/stand-in.txt "stand-in"

      - name: Install front-end packages
        working-directory: app
        run: npm ci

      - name: Type check
        working-directory: app
        run: npx tsc --noEmit

      - name: Front-end tests
        working-directory: app
        run: npx vitest run

      - name: Build the front end
        working-directory: app
        run: npm run build

      - name: Rust tests
        run: cargo test --workspace

      - name: Rust lint (advice only)
        run: cargo clippy --workspace --all-targets
        continue-on-error: true

      - name: Known vulnerabilities in shipped packages
        working-directory: app
        run: npm audit --omit=dev --audit-level=high
